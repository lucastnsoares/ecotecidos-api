# ==========================================
# CONFIGURAÇÕES GLOBAIS DA APLICAÇÃO
# ==========================================
spring.application.name=ecotecidos
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# SERVIDOR
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api/v1
server.forward-headers-strategy=framework

# UPLOAD DE ARQUIVOS
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# JPA / HIBERNATE & FLYWAY
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
app.seed.enabled=${SEED_ENABLED:true}

# DOCUMENTAÇÃO SWAGGER / OPENAPI (rotas e ordenação padrão)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# SPRING ACTUATOR (configuração base e probes de container)
management.server.port=${MANAGEMENT_PORT:9090}
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState

# SEGURANÇA (JWT & CORS)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
api.security.token.secret=${TOKEN_JWT_SECRET:chave-secreta}
api.security.token.issuer=${TOKEN_ISSUER:ecotecidos-api}
api.security.token.expiration-seconds=${TOKEN_EXPIRATION_SECONDS:3600}
api.security.cors.allowed-origins=${API_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# SPRING MAIL (propriedades globais de SMTP)
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.from=${MAIL_FROM:}
spring.mail.host=${MAIL_SMTP_HOST:}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.auth=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

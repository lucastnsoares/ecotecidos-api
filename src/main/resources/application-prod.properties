# ==========================================
# PERFIL DE PRODUÇÃO (prod)
# ==========================================

# SERVIDOR
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
server.error.include-stacktrace=never
server.error.include-exception=false

# SEGURANÇA (possui fallbacks para subida inicial, mas é altamente recomendável sobrescrever em produção)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
api.security.token.secret=${TOKEN_JWT_SECRET:chave-padrao-temporaria-altere-em-producao}
api.security.cors.allowed-origins=${API_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# BANCO DE DADOS E POOL HIKARICP (possui fallback, mas é altamente recomendável definir credenciais fortes em produção)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ecotecidos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=30000

# DOCUMENTAÇÃO SWAGGER (desabilitada por padrão em produção)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# DEVTOOLS DESABILITADO
spring.devtools.add-properties=false
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# LOGS
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.br.com.maisprati.ecotecidos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO

# SPRING MAIL (sempre habilitado em produção; altamente recomendável configurar credenciais SMTP reais)
app.mail.enabled=true
app.mail.from=${MAIL_FROM:noreply@ecotecidos.com.br}
spring.mail.host=${MAIL_SMTP_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_SMTP_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# SPRING ACTUATOR RESTRITO
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.loggers.enabled=false
management.health.mail.enabled=${MAIL_HEALTH_ENABLED:false}

# SEED DE USUÁRIOS INICIAIS
app.seed.admin.name=${SEED_ADMIN_NAME:}
app.seed.admin.document=${SEED_ADMIN_DOCUMENT:}
app.seed.admin.email=${SEED_ADMIN_EMAIL:}
app.seed.admin.phone=${SEED_ADMIN_PHONE:}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}

app.seed.doador.name=${SEED_DOADOR_NAME:}
app.seed.doador.document=${SEED_DOADOR_DOCUMENT:}
app.seed.doador.email=${SEED_DOADOR_EMAIL:}
app.seed.doador.phone=${SEED_DOADOR_PHONE:}
app.seed.doador.password=${SEED_DOADOR_PASSWORD:}

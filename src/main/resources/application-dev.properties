# ==========================================
# PERFIL DE DESENVOLVIMENTO (dev)
# ==========================================

# SEGURANÇA CORS (permissivo para portas locais)
api.security.cors.allowed-origins=${API_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5500,http://127.0.0.1:*,*}

# BANCO DE DADOS
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:projeto_final_dev}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# DOCUMENTAÇÃO SWAGGER
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# SPRING BOOT DEVTOOLS
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# LOGS E DEBUG SQL
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# SPRING ACTUATOR (detalhado para inspeção local)
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoints.web.exposure.include=health,info,metrics,mappings,loggers
management.endpoint.loggers.enabled=true
management.health.mail.enabled=false


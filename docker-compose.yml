name: ecotecidos-backend

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecotecidos-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-ecotecidos_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ecotecidos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ecotecidos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecotecidos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
      - "${MANAGEMENT_PORT:-9090}:9090"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-ecotecidos_db}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-ecotecidos_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      TOKEN_JWT_SECRET: ${TOKEN_JWT_SECRET:-chave-padrao-temporaria-altere-em-producao}
      TOKEN_ISSUER: ${TOKEN_ISSUER:-ecotecidos-api}
      TOKEN_EXPIRATION_SECONDS: ${TOKEN_EXPIRATION_SECONDS:-3600}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      API_SECURITY_CORS_ALLOWED_ORIGINS: ${API_SECURITY_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      MAIL_ENABLED: "true"
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-smtp.gmail.com}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@ecotecidos.com.br}
      FILE_UPLOAD_DIR: /app/uploads
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-}
      SEED_ADMIN_DOCUMENT: ${SEED_ADMIN_DOCUMENT:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DOADOR_NAME: ${SEED_DOADOR_NAME:-}
      SEED_DOADOR_DOCUMENT: ${SEED_DOADOR_DOCUMENT:-}
      SEED_DOADOR_EMAIL: ${SEED_DOADOR_EMAIL:-}
      SEED_DOADOR_PHONE: ${SEED_DOADOR_PHONE:-}
      SEED_DOADOR_PASSWORD: ${SEED_DOADOR_PASSWORD:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - ecotecidos-net

volumes:
  postgres_data:
  uploads_data:

networks:
  ecotecidos-net:
    driver: bridge
